# Default configuration for a cluster.
#
# Note: Environment variables are named for their original WWIIOL selves.

############################### CONFIG ###############################

# A cluster is a group of one or more machines that peer together
# to implement an instance of the WWIIOL game world. There can be
# many clusters within a single network.
#
# The role of a cluster is determined by it's AppID and it's ArenaID.
# AppID indicates which client software the cluster is intended to
# interact with: 1 is the production/release software, 5 is playgate/auth
# and 12 is beta/dev.
# ArenaID is the database ID for the "game world" a specific cluster
# is mean't to represent, the meaning of a given arenaID is defined
# in the database and is for human consumption.
# In WWIIOL:
#  1 = live, 22 = training, 222 = beta, 250 = in-house dev.

# Mnemonic name for this cluster (e.g. live, dev, beta, etc).
#WWII_CLUSTER=dev

# 1 = Production, 5 = Playgate/Auth, 12 = Beta.
#APP_ID=12

# Game world ID. 250 is nominally used for in-house dev.
#ARENA_ID=250

# Language used by the server - either en or zh
STRAT_LANGUAGE=en

############################# FILESYSTEM #############################
#
# The game assumes you have a top-level directory with a structure of
# /root
#   +-- data
#   |     +-- terrain
#   |     +-- th_blitz
#   |          +-- weapon
#   +-- etc
#   +-- wwiiol
#   |     +-- bin
#   |     +-- lua
#   |     +-- web
#   |     |    +-- debug
#
# Typically this is the /playnet filesystem which is hosted on the strat
# server and nfs mounted by the rest of the cluster.

# Default path for log files - shouldn't be in the shared filesystem.
#LOG_PATH="/tmp"

# Top level directory.
#DATA_DIR=/playnet/data

# World/terrain data are sourced from SDM files which used to be stored
# in ${root}/wwiiol/bin/data/terrain, but are now in ${root}/data/terrain.
#TERRAIN_SUBDIR=terrain

# The server only uses a subset of the sdm files, determined by running
# sdmpp on the terrain file and producing an "import list". This file
# is usually ${DATA_DIR}/importlist.txt
#IMPORT_FILE=importlist.txt

# Validated sdm files come with an "origin" file describing which terrain
# build the sdm files are from. This file is usually ${DATA_DIR}/${TERRAIN}/origin
#ORIGIN_FILE=origin

# Location of the Lua startup file.
LUA_BASE_PATH=/playnet/wwiiol/lua
LUA_RC_FILE=rc.lua
LUA_STRATLIB_FILE=stratlib.lua

# Location of the debug web server files.
TEUL_UWEB_PATH=/playnet/wwiiol/web/debug

############################# NETWORKING #############################
#
# We support upto 3 network interfaces, so long as each server has the
# same last octet on each network.
#
# The first network is the public network intended for exchanging
# data with players.
# The second network is for server-to-server peering and comms.
# The third network should be exclusive to cell hosts.
#
# WWII Online production servers used:
#  eth0 = 66.28.224.x and 204.109.244.x for player access,
#  eth1 = 192.168.10.x for server-to-server
# And cell hosts had a third nic
#  eth2 = 192.168.11.x

# The servers auto-detect their public IP addresses by looking at
# one network interface. By default, this is eth0.
#DEFAULT_IFACE=eth0

# The "BASE_ADDRESS" is the /24 to use for server-to-server peering.
#BASE_ADDRESS=192.168.0.0

# Providing an IRC server provides a way to monitor and interact with
# the game server and players. Servers are named "^<server type>" and
# operate as relatively simple bots that respond to "." commands, e.g.
# on #<cluster>-sys you can type ".help" and all registered servers
# will respond with a list of commands they accept.
# They also log in to #<cluster>-hc, #<cluster>-gm, etc.
#WWII_IRC_SERVER=
#WWII_IRC_PASSWD=
#WWII_IRC_PORT=

############################## DATABASE ##############################
#
# The game servers have a dedicated MySQL instance which serves as a
# replication master to other services that need game data such as
# the web infrastructure. This minimizes the likely hood of the game
# having contention on write access.
#
# For a single cluster, it can also host the auth data, but if you
# are sharing auth data between multiple clusters you will want a
# primary auth database that sits with the auth host and which the
# game masters replicate copies for themselves.

# IP address of the MySQL server hosting the primary game database.
#WWII_DB_ADDRESS=127.0.0.1
# Default database schema to use.
#WWII_DB_SCHEMA=wwiionline

# IP address of the server running the dbd.
#DBSE_PRIMARY_ADDRESS=?

# IP address of the auth database.
#AUTH_DB=auth.playnet.com
# Defaults for auth database
#AUTH_DB_PORT=
#AUTH_DB_USER=
#AUTH_DB_PASSWD=
#AUTH_DB_SCHEMA=

